name: Build and Push GHCR Image

on:
  workflow_call:
    inputs:
      image-name:
        description: "Override the image name. Defaults to the caller repository."
        required: false
        type: string
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and publish container
        uses: justinmarkmarshall/github-actions/.github/actions/build-push-ghcr@main
        with:
          image-name: ${{ inputs.image-name }}
          token: ${{ github.token }}
