name: .NET Test, Build and Push

on:
  workflow_call:
    inputs:
      solution:
        description: Path to the solution or project to restore and test.
        required: true
        type: string
      dotnet-version:
        description: .NET SDK version to install.
        required: false
        type: string
        default: "10.0.x"
      image-name:
        description: Override the image name. Defaults to the caller repository.
        required: false
        type: string
        default: ""

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        uses: justinmarkmarshall/github-actions/.github/actions/dotnet-test@main
        with:
          solution: ${{ inputs.solution }}
          dotnet-version: ${{ inputs.dotnet-version }}

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and publish container
        uses: justinmarkmarshall/github-actions/.github/actions/build-push-ghcr@main
        with:
          image-name: ${{ inputs.image-name }}
          token: ${{ github.token }}
