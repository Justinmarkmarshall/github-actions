name: Build and Push GHCR Image

description: Builds a Docker image and publishes it to GitHub Container Registry

inputs:
  image-name:
    description: Override the image name. Defaults to the repository name.
    required: false
    default: ""

  registry:
    description: Container registry
    required: false
    default: ghcr.io

  token:
    description: Token used to authenticate with GHCR
    required: true

runs:
  using: composite

  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Determine image name
      id: image
      shell: bash
      run: |
        if [ -n "${{ inputs.image-name }}" ]; then
          echo "name=${{ inputs.image-name }}" >> "$GITHUB_OUTPUT"
        else
          echo "name=${{ github.repository }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Extract metadata
      id: metadata
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ steps.image.outputs.name }}
        tags: |
          type=ref,event=branch
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix=commit-

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.metadata.outputs.tags }}
        labels: ${{ steps.metadata.outputs.labels }}
